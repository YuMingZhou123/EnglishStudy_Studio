name: english-study-studio

services:
  postgres:
    image: postgres:17
    container_name: english-study-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: english_study
      POSTGRES_USER: english_study
      POSTGRES_PASSWORD: english_study_password
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english_study -d english_study"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: english-study-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: englishstudy
      MINIO_ROOT_PASSWORD: englishstudysecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: english-study-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 englishstudy englishstudysecret; do sleep 2; done;
      mc mb --ignore-existing local/english-study;
      mc anonymous set download local/english-study/audio;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
